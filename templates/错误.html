{% extends "基础.html" %}
{% block title %}{{ code }} · 暂时无法继续{% endblock %}
{% block content %}<section class="empty-state error-page"><p class="heading-1 error-code">{{ code }}</p><h1 class="heading-4">{{ '这条线索暂时找不到了' if code == 404 else '暂时无法继续' }}</h1><p class="body-3 muted">{{ message }}</p><a class="button button-md" href="{{ url_for('index') }}">返回失物广场</a></section>{% endblock %}
