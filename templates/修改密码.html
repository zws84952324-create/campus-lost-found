{% extends "基础.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<a class="back-link caption-1" href="{{ url_for('dashboard') }}">← 返回我的记录</a>
<section class="form-panel prose"><h1 class="heading-3">修改密码</h1><p class="body-6 muted">修改成功后，其他设备需要使用新密码重新登录。</p>
  {% if error %}<p class="notice error body-6" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="title-4">当前密码<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label>
    <label class="title-4">新密码<input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="10 至 128 个字符"></label>
    <label class="title-4">确认新密码<input type="password" name="confirm_password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <button class="button button-md">保存新密码</button>
  </form>
</section>
{% endblock %}
